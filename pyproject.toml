[project]
name = "currency-agent"
version = "0.1.0"
description = "Currency conversion agent using ADK, MCP and A2A"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.3",
    "fastmcp>=2.11.3",
    "google-adk>=2.1.0",
    "google-genai>=1.17.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "a2ui-agent-sdk>=0.2.1",
    "opentelemetry-semantic-conventions>=0.62b1",
    "python-json-logger>=2.0.0",
    "fastapi",
    "uvicorn",
    "httpx-sse",
    "google-cloud-logging",
    "opentelemetry-exporter-gcp-trace",
    "google-auth",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff.lint]
ignore = ["E402"]

